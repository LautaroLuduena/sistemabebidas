<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Catálogo y pedidos</title>
  <link rel="icon" href="/img/logo.jpg">
  <link rel="stylesheet" href="/css/tienda.css">
</head>
<body>
  <header class="shop-header">
    <div class="shop-brand"><img src="/api/logo" alt="" id="shopLogo" onerror="this.remove()"><div><b id="shopName"></b><div class="muted" id="shopHello"></div></div></div>
  </header>
  <main class="shop-main">
    <div id="shopNotice"></div>
    <div class="shop-filters">
      <input id="q" type="search" placeholder="🔍 Buscar producto o marca" autocomplete="off">
      <div class="chips" id="cats"></div>
    </div>
    <div class="products" id="products"><div class="empty">Cargando catálogo…</div></div>
  </main>

  <button class="cart-bar" id="cartBar" hidden>
    <span>🛒 <b id="cartCount">0</b> productos</span>
    <span id="cartTotal"></span>
    <span class="cart-go">Ver pedido →</span>
  </button>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-panel" role="dialog" aria-label="Tu pedido">
      <header><h2>Tu pedido</h2><button class="icon" id="closeDrawer" aria-label="Cerrar">✕</button></header>
      <div id="cartItems"></div>
      <div class="cart-sum" id="cartSum"></div>
      <form id="orderForm">
        <label>Nombre *<input name="name" required maxlength="80" autocomplete="name"></label>
        <label>Teléfono <span id="phoneReq">*</span><input name="phone" maxlength="40" inputmode="tel" autocomplete="tel"></label>
        <label>Dirección de entrega<input name="address" maxlength="160" autocomplete="street-address" placeholder="Calle, número, localidad"></label>
        <label>Notas<textarea name="notes" rows="2" maxlength="500" placeholder="Ej: horario de entrega, forma de pago"></textarea></label>
        <div class="error" id="orderError"></div>
        <button class="btn-wa" id="sendBtn" type="submit">Enviar pedido por WhatsApp</button>
        <p class="muted small">El pedido queda registrado y se abre WhatsApp con el detalle para que lo envíes. Los precios y la disponibilidad se confirman al responderte.</p>
      </form>
    </div>
  </div>

  <div class="drawer" id="doneBox" hidden>
    <div class="drawer-panel done">
      <div style="font-size:48px">✅</div>
      <h2 id="doneTitle">¡Pedido registrado!</h2>
      <p id="doneText" class="muted"></p>
      <a class="btn-wa" id="doneWa" target="_blank" rel="noopener">Abrir WhatsApp y enviar</a>
      <button class="btn-light" id="doneClose">Seguir mirando el catálogo</button>
    </div>
  </div>
  <script src="/js/tienda.js"></script>
</body>
</html>
